<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Studio VPS Router</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>AI Studio VPS Router</h1><p>Route Google AI traffic through your VPS.</p><label>Host<input id="host" placeholder="YOUR_VPS_IP"></label><label>Port<input id="port" type="number" value="3128"></label><label>Scheme<select id="scheme"><option>http</option><option>https</option><option>socks4</option><option>socks5</option></select></label><label>Username<input id="username" placeholder="aiproxy"></label><label>Password<input id="password" type="password"></label><label class="toggle">Enable proxy <input id="enabled" type="checkbox"></label><button id="test" type="button">Test Connection</button><button id="save" type="button">Save</button><div id="message"></div><a href="https://aistudio.google.com/" target="_blank">Open Google AI Studio ↗</a></main><script src="popup.js"></script></body></html>
